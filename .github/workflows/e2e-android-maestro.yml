# Maestro Cloud E2E — backgammon smoke on labeled PRs or manual dispatch.
# Label: android-test-maestro-cloud | Secret: MAESTRO_CLOUD_API_KEY

name: E2E Tests Android (Maestro Cloud)

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-maestro-cloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-test-apk:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'android-test-maestro-cloud')
    name: Maestro Cloud smoke (backgammon)
    runs-on: ubuntu-latest

    steps:
      - name: Check for MAESTRO_CLOUD_API_KEY
        run: |
          if [ -z "${{ secrets.MAESTRO_CLOUD_API_KEY }}" ]; then
            echo "Add MAESTRO_CLOUD_API_KEY to Settings → Secrets → Actions"
            echo "https://cloud.mobile.dev/ci-integration/github-actions#add-your-api-key-secret"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Set Up JDK + Generate Test APK
        uses: ./.github/actions/setup-jdk-generate-apk
        with:
          APP_ENV: preview

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: ./android-test.apk

      - name: Run backgammon smoke on Maestro Cloud (try 1)
        id: maestro_try1
        uses: mobile-dev-inc/action-maestro-cloud@v1.4.1
        continue-on-error: true
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: ./android-test.apk
          include-tags: smoke
          env: |
            APP_ID=com.backgammonmastermind.preview

      - name: Run backgammon smoke on Maestro Cloud (try 2)
        id: maestro_try2
        if: steps.maestro_try1.outcome == 'failure'
        uses: mobile-dev-inc/action-maestro-cloud@v1.4.1
        continue-on-error: true
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: ./android-test.apk
          include-tags: smoke
          env: |
            APP_ID=com.backgammonmastermind.preview

      - name: Run backgammon smoke on Maestro Cloud (try 3)
        id: maestro_try3
        if: steps.maestro_try1.outcome == 'failure' && steps.maestro_try2.outcome == 'failure'
        uses: mobile-dev-inc/action-maestro-cloud@v1.4.1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: ./android-test.apk
          include-tags: smoke
          env: |
            APP_ID=com.backgammonmastermind.preview

      - name: Require Maestro Cloud success
        if: |
          steps.maestro_try1.outcome == 'failure' &&
          (steps.maestro_try2.outcome == 'failure' || steps.maestro_try2.outcome == 'skipped') &&
          steps.maestro_try3.outcome == 'failure'
        run: exit 1

      - name: Maestro Cloud console
        if: always()
        run: |
          echo "Try 1 → ${{ steps.maestro_try1.outputs.MAESTRO_CLOUD_CONSOLE_URL }}"
          echo "Try 2 → ${{ steps.maestro_try2.outputs.MAESTRO_CLOUD_CONSOLE_URL }}"
          echo "Try 3 → ${{ steps.maestro_try3.outputs.MAESTRO_CLOUD_CONSOLE_URL }}"
