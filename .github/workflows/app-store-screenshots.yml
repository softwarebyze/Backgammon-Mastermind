name: Upload App Store Screenshots

on:
  workflow_dispatch:

jobs:
  upload:
    name: Upload iPhone and iPad screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account."
            exit 1
          fi

      - name: Checkout release assets
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Upload screenshots to App Store Connect
        run: pnpm screenshots:upload:ios
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
