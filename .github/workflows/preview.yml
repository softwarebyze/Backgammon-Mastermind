# Publishes an EAS Update on every PR and comments with a QR code.
# First-time reviewers install the dev client once (see sticky PR comment + dev-client.yml).
# Docs: https://docs.expo.dev/eas-update/github-actions/

name: EAS Update Preview (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  EAS_PROJECT_ID: 7ec6600a-8b02-4714-acc1-08385effa4c9

jobs:
  update:
    name: EAS Update Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create preview
        id: preview
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --auto --environment preview

      - name: Post dev client setup guide
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- dev-client-guide -->';
            const buildsUrl = `https://expo.dev/projects/${process.env.EAS_PROJECT_ID}/builds?profile=development`;
            const buildsQr = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(buildsUrl)}`;
            const body = `${marker}
            **Preview:** scan the **EAS Update QR** in the Expo comment above with a device that has the dev client installed.

            <details>
            <summary>First time on this device? Install the dev client</summary>

            Scan to open the latest **development** builds, or use [this link](${buildsUrl}):

            <img src="${buildsQr}" width="180" alt="QR code to latest development builds" />

            - **iPhone / iPad**: [register your device](https://expo.dev/accounts/zackebenfeld/projects/backgammon-mastermind/devices) (one-time), open the latest **iOS** build in Safari and install, open the app once, then scan the EAS Update QR above.
            - **Android**: download the latest **APK**, install, open the app once, then scan the EAS Update QR above.
            - **Reinstall** only when native things change (Expo SDK, native modules, icon/splash, \`app.config.ts\`, \`env.ts\`) — CI rebuilds via [\`dev-client.yml\`](.github/workflows/dev-client.yml). JS-only PRs never need a reinstall.
            - **No dev client at all?** \`pnpm build:preview:ios\` / \`pnpm build:preview:android\` — see [\`docs/obytes-template-playbook.md\`](docs/obytes-template-playbook.md#dev-client--pr-preview-workflow-recommended-fork-pattern).

            </details>
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
            else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
