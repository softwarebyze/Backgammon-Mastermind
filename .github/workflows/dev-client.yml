# Rebuild development clients when native deps or branding change.
# Push: Android only (no Apple credentials required in CI).
# iOS: run workflow manually after one-time local credential setup — see assets/brand/README.md

name: Dev Client (native changes)

on:
  push:
    branches: [main, obytes]
    paths:
      - package.json
      - pnpm-lock.yaml
      - app.config.ts
      - eas.json
      - env.ts
      - assets/**
      - .github/workflows/dev-client.yml
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build on EAS
        type: choice
        options:
          - android
          - ios
          - all
        default: android

jobs:
  build-android:
    name: Build development client (android)
    if: github.event_name == 'push' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: EAS Build (development, android)
        uses: ./.github/actions/eas-build
        with:
          APP_ENV: development
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERSION: ${{ github.sha }}
          ANDROID: 'true'
          IOS: 'false'
          AUTO_SUBMIT: 'false'

  build-ios:
    name: Build development client (ios)
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: iOS credential reminder
        run: |
          cat <<'EOF'
          iOS cloud builds need Apple credentials stored on Expo (one-time, interactive).
          If this job fails with "credentials suitable for internal distribution":
            pnpm build:development:ios
          (no --non-interactive — log in and let EAS create/select certificates)
          Then re-run this workflow.
          Docs: https://docs.expo.dev/app-signing/app-credentials/
          EOF

      - name: EAS Build (development, ios)
        uses: ./.github/actions/eas-build
        with:
          APP_ENV: development
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          VERSION: ${{ github.sha }}
          ANDROID: 'false'
          IOS: 'true'
          AUTO_SUBMIT: 'false'
