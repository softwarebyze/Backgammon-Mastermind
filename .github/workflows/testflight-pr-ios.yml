# Put a pull request on your iPhone through TestFlight without an EAS build.
#
# Builds the Preview app (com.backgammonmastermind.preview) on a GitHub Mac,
# signs it with the App Store credentials EAS already keeps (read through the
# Expo API, no EAS build minutes), and uploads it to TestFlight with the App
# Store Connect key stored in EAS. Needs only the EXPO_TOKEN secret.
#
# Trigger: add the `testflight` label to a PR. While the label stays on,
# every push uploads a new build. Or run it from the Actions tab once this
# workflow is on main.
name: TestFlight (PR, no EAS build)

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: testflight-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  testflight:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'testflight') &&
        (github.event.action != 'labeled' || github.event.label.name == 'testflight'))
    name: Build and upload to TestFlight
    # Same image as the iOS smoke: Xcode 26 / Swift 6.2 is required.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_NO_DOTENV: '1'
      APP_ENV: preview
      EXPO_PUBLIC_APP_ENV: preview
      CI: 'true'
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is required to read signing credentials from EAS."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch bgsage engine (pinned commit)
        run: bash .github/scripts/fetch-bgsage-engine.sh

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Setup Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Read signing credentials and App Store Connect key from EAS
        run: |
          node scripts/ios-signing-from-eas.mjs
          node scripts/asc-api-key-from-eas.mjs
          # No EAS credentials for the Messages extension: build without it.
          if node -e "process.exit(require('./.cache/ios-signing/signing.json').skipped.some(id => id.endsWith('.messages')) ? 0 : 1)"; then
            echo "WITHOUT_IMESSAGE_EXTENSION=1" >> "$GITHUB_ENV"
            echo "::notice::Building without the Messages extension: EAS has no App Store credentials for it."
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build expo-bgsage TS
        run: ./node_modules/.bin/tsc -p expo-bgsage/tsconfig.json

      - name: Generate brand assets
        run: pnpm brand:generate

      - name: Prebuild native project
        run: |
          for attempt in 1 2 3; do
            rm -rf ios android
            if pnpm prebuild:preview; then
              exit 0
            fi
            echo "::warning::prebuild attempt ${attempt} failed; retrying..."
            sleep 5
          done
          exit 1

      # Always run this PR's own bundle: never swap in an update published to
      # the preview channel.
      - name: Turn off over-the-air updates in this build
        run: |
          plist=$(find ios -name Expo.plist -not -path '*/Pods/*' | head -1)
          test -n "$plist" || { echo "::error::Expo.plist not found"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Set :EXUpdatesEnabled false' "$plist" \
            || /usr/libexec/PlistBuddy -c 'Add :EXUpdatesEnabled bool false' "$plist"

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Skip PostHog uploads without an API key
        run: bash .github/scripts/skip-posthog-ios-upload-when-unkeyed.sh "$GITHUB_WORKSPACE"

      - name: Build, sign and upload to TestFlight
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          export IOS_SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/^ *Schemes:$/{f=1;next} f && NF{print $1; exit}')
          cd ..
          bundle exec fastlane ios testflight_pr
          echo "BUILD=$(cat .cache/testflight/build.txt)" >> "$GITHUB_ENV"

      - name: Post the TestFlight build on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER='<!-- pr-ios-testflight -->'
          if [ "$OUTCOME" = "success" ]; then
            BODY="${MARKER}
          ✈️ **On TestFlight:** Backgammon Mastermind Preview **${BUILD}**, built from \`${SHA:0:8}\`.${WITHOUT_IMESSAGE_EXTENSION:+ (Without the Messages extension: EAS has no App Store credentials for it.)}

          Apple takes a few minutes to process it, then it shows up in the TestFlight app on your iPhone. Every push while this PR has the \`testflight\` label uploads a new build."
          else
            BODY="${MARKER}
          ✈️ TestFlight upload failed for \`${SHA:0:8}\`. [Log](${RUN_URL})"
          fi
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${ID}" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$BODY" >/dev/null
          fi

      - name: Remove signing material
        if: always()
        run: rm -rf .cache/ios-signing .cache/asc-api-key.json
