# Push App Store listing from store.config.json (EAS Metadata).
# Run after preview/production binary is in App Store Connect.

name: EAS Metadata Push

on:
  workflow_dispatch:

jobs:
  metadata:
    name: Push store.config.json to App Store Connect
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account."
            exit 1
          fi

      - name: 📦 Checkout project repo
        uses: actions/checkout@v4

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 📦 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📝 Push metadata (preview listing)
        run: pnpm metadata:push
        env:
          EXPO_PUBLIC_APP_ENV: preview
