# Push App Store listing from store.config.js + store/locales/ (EAS Metadata).
# Prefer this over one-off App Store Connect API scripts.
# Run after the target ASC app has an editable version + binary.

name: EAS Metadata Push

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Submit profile (which ASC app)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  metadata:
    name: Push store metadata (${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account."
            exit 1
          fi

      - name: 📦 Checkout project repo
        uses: actions/checkout@v4

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 📦 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📝 Push metadata
        run: |
          if [ "${{ inputs.profile }}" = "production" ]; then
            pnpm metadata:push:production
          else
            pnpm metadata:push
          fi
