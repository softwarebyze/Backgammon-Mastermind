# GitHub-hosted emulator E2E — auto-runs when app code changes (no label required).
# Optional label android-test-github forces a run on any PR. Manual dispatch always works.
# Visual report: inline screenshots on PR comment + Summary (raw.githubusercontent.com URLs).

name: E2E Tests Android (Maestro + Github Action)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-github-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'src/**'
              - '.maestro/**'
              - 'app.config.ts'
              - 'env.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/actions/setup-jdk-generate-apk/**'
              - '.github/scripts/run-maestro-e2e-emulator.sh'
              - '.github/scripts/maestro-post-e2e-report.sh'
              - '.github/scripts/maestro-publish-screenshots.sh'

  generate-test-apk:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.e2e == 'true') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'android-test-github')))
    name: Generate Test APK (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Set Up JDK + Generate Test APK
        uses: ./.github/actions/setup-jdk-generate-apk
        with:
          APP_ENV: preview

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: ./android-test.apk
          if-no-files-found: error

  test-android:
    needs: [changes, generate-test-apk]
    if: |
      always() &&
      needs.generate-test-apk.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.e2e == 'true') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'android-test-github')))
    name: Run backgammon smoke (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Maestro
        run: npm run install-maestro

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download Test APK
        uses: actions/download-artifact@v4
        with:
          name: test-apk
          path: ${{ github.workspace }}

      - name: Enable KVM (hardware emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run backgammon smoke with Maestro
        id: maestro_emulator
        uses: reactivecircus/android-emulator-runner@v2.37.0
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          working-directory: ${{ github.workspace }}
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          cores: 2
          ram-size: 4096M
          script: bash .github/scripts/run-maestro-e2e-emulator.sh "${{ github.workspace }}" com.backgammonmastermind.preview

      - name: Publish visual Maestro report
        if: always()
        uses: ./.github/actions/maestro-e2e-report
        with:
          maestro-output-dir: ${{ github.workspace }}/.maestro-ci-output
          junit-report: ${{ github.workspace }}/report.xml

      - name: Upload Maestro logs (legacy path)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: |
            .maestro-ci-output/**
            ~/.maestro/tests/**/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e_android_report
          path: report.xml
          if-no-files-found: ignore
          retention-days: 14
