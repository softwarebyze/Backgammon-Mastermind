# GitHub-hosted emulator E2E — auto-runs when app code changes (no label required).
# Optional label android-test-github forces a run on any PR. Manual dispatch always works.
# Visual report: inline screenshots on PR comment + Summary (raw.githubusercontent.com URLs).

name: E2E Tests Android (Maestro + Github Action)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-github-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'src/**'
              - '.maestro/**'
              - 'app.config.ts'
              - 'env.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/e2e-android.yml'
              - '.github/actions/setup-jdk-generate-apk/**'
              - '.github/scripts/run-maestro-e2e-emulator.sh'
              - '.github/scripts/merge-maestro-shards.mjs'
              - '.github/actions/maestro-e2e-report/**'
              - '.github/scripts/install-android-system-image.sh'
              - '.github/scripts/maestro-post-e2e-report.sh'
              - '.github/scripts/maestro-publish-screenshots.sh'
              - '.github/scripts/maestro-publish-video.sh'
              - '.github/scripts/publish-pr-apk.sh'

  generate-test-apk:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.e2e == 'true') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'android-test-github')))
    name: Generate Test APK (Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Set Up JDK + Generate Test APK
        uses: ./.github/actions/setup-jdk-generate-apk
        with:
          APP_ENV: preview

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: ./android-test.apk
          if-no-files-found: error

      - name: Publish installable APK link for this PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: bash .github/scripts/publish-pr-apk.sh ./android-test.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Flows run in parallel shards listed in .maestro/android-shards.json. Each
  # shard boots its own emulator; test-android merges their results into one
  # report. Keep the matrix in step with the number of shards in that file
  # (src/lib/maestro-flow-coverage.test.ts checks it).
  e2e-shard:
    needs: [changes, generate-test-apk]
    if: |
      always() &&
      needs.generate-test-apk.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.e2e == 'true') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'android-test-github')))
    name: E2E shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Maestro
        run: npm run install-maestro

      # ffmpeg only joins recording segments; the run script warns if it is
      # missing. A slow Ubuntu mirror once held this step for 29 minutes, so
      # bound each attempt and let the smoke test run without it.
      - name: Install recording tools
        timeout-minutes: 8
        continue-on-error: true
        run: |
          if command -v ffmpeg >/dev/null; then
            echo "ffmpeg already installed"
            exit 0
          fi
          apt_opts=(-q -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60)
          for attempt in 1 2; do
            if sudo timeout 60 apt-get "${apt_opts[@]}" update \
              && sudo timeout 150 apt-get "${apt_opts[@]}" install -y --no-install-recommends ffmpeg; then
              exit 0
            fi
            echo "::warning::ffmpeg install attempt $attempt failed or timed out"
          done
          echo "::warning::ffmpeg unavailable; recording segments will not be joined"

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Download Test APK
        uses: actions/download-artifact@v4
        with:
          name: test-apk
          path: ${{ github.workspace }}

      - name: Enable KVM (hardware emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Transient sdkmanager ZipFile corruptions ("unknown archive") — retry before the runner
      # so its own install is a no-op against a warm, valid system image.
      - name: Pre-install Android system image (retry)
        run: bash .github/scripts/install-android-system-image.sh 34 google_apis x86_64

      - name: Run Maestro shard ${{ matrix.shard }}
        id: maestro_emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          working-directory: ${{ github.workspace }}
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          cores: 2
          ram-size: 4096M
          script: bash .github/scripts/run-maestro-e2e-emulator.sh "${{ github.workspace }}" com.backgammonmastermind.preview ${{ matrix.shard }}

      # upload-artifact skips hidden paths such as .maestro-ci-output, so stage
      # the shard's results under a plain directory first.
      - name: Stage shard results
        if: always()
        run: |
          mkdir -p maestro-shard-out
          if [[ -d .maestro-ci-output ]]; then cp -a .maestro-ci-output maestro-shard-out/output; fi
          if [[ -f report.xml ]]; then cp report.xml maestro-shard-out/report.xml; fi
          if [[ -f e2e-recording.mp4 ]]; then cp e2e-recording.mp4 maestro-shard-out/e2e-recording.mp4; fi

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-shard-${{ matrix.shard }}
          path: maestro-shard-out/
          if-no-files-found: warn
          retention-days: 14

  # Same job name as the single-emulator run it replaces, so existing checks
  # and the PR comment keep working. It fails unless every shard passed and
  # every listed flow reported a result.
  test-android:
    needs: [changes, generate-test-apk, e2e-shard]
    if: |
      always() &&
      needs.generate-test-apk.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.e2e == 'true') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'android-test-github')))
      && needs.e2e-shard.result != 'skipped'
    name: Run backgammon smoke (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A shard that died before uploading leaves no artifact; the merge step
      # then records its flows as failures instead of this step erroring.
      - name: Download shard results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: maestro-shard-*
          path: maestro-shards

      - name: Merge shard results
        if: always()
        run: node .github/scripts/merge-maestro-shards.mjs .maestro/android-shards.json maestro-shards "${{ github.workspace }}"

      - name: Publish visual Maestro report
        if: always()
        uses: ./.github/actions/maestro-e2e-report
        with:
          maestro-output-dir: ${{ github.workspace }}/.maestro-ci-output
          junit-report: ${{ github.workspace }}/report.xml

      - name: Upload Maestro logs (legacy path)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: maestro-shards/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e_android_report
          path: report.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Require every shard and flow to pass
        if: always()
        env:
          SHARDS_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          status=0
          if [[ "$SHARDS_RESULT" != "success" ]]; then
            echo "::error::E2E shards finished with result: $SHARDS_RESULT"
            status=1
          fi
          if [[ ! -f report.xml ]] || grep -qE '(failures|errors)="[1-9]' report.xml; then
            echo "::error::Merged JUnit report is missing or has failures"
            status=1
          fi
          exit "$status"
