# Re-render Remotion marketing videos on every GitHub Release and commit
# them to main under docs/marketing/videos/.
#
# Manual: Actions → Remotion Render (Release Assets) → Run workflow
# Local:  cd remotion && pnpm install && pnpm render:all
#
# Linux CI must use --gl=swangle (no GPU). Local scripts keep --gl=angle.
# See https://www.remotion.dev/docs/gl-options

name: Remotion Render (Release Assets)

on:
  release:
    types: [published]
  workflow_dispatch:

# One render lane; do not cancel in-flight jobs so a long render can finish,
# but reject stale/outdated pushes before overwriting docs/marketing/videos.
concurrency:
  group: remotion-render-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-and-commit:
    name: Render Remotion → commit to main
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout release / ref for render source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Resolve marketing version
        id: ver
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TAG}" ]; then
            V="${RELEASE_TAG}"
            V="${V#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Marketing version: $V"

      - name: Setup Node (remotion package)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack / pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.3 --activate

      - name: Install Remotion dependencies
        working-directory: remotion
        run: pnpm install --frozen-lockfile

      - name: Ensure Chrome Headless Shell
        working-directory: remotion
        run: pnpm exec remotion browser ensure

      - name: Render compositions
        working-directory: remotion
        env:
          REMOTION_GL: swangle
        run: pnpm render:all

      - name: Stage outputs outside the git worktree switch
        run: |
          set -euo pipefail
          mkdir -p /tmp/remotion-marketing-out
          cp remotion/out/*.mp4 /tmp/remotion-marketing-out/

      - name: Checkout main for asset commit
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-checkout
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Copy assets, commit, push to main
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_TAG: ${{ github.event.release.tag_name }}
        working-directory: main-checkout
        run: |
          set -euo pipefail

          # Reject stale renders: a release for an older tag must not overwrite
          # videos rendered for a newer tag.
          if [ -n "${SOURCE_TAG}" ]; then
            git fetch origin --tags --force
            NEWEST="$(git tag -l 'v*' | sort -V | tail -n1)"
            if [ -n "${NEWEST}" ] && [ "${NEWEST}" != "${SOURCE_TAG}" ] \
              && [ "$(printf '%s\n%s\n' "${SOURCE_TAG}" "${NEWEST}" | sort -V | tail -n1)" = "${NEWEST}" ]; then
              echo "Skipping push: ${SOURCE_TAG} is older than ${NEWEST}."
              exit 0
            fi
          fi

          DEST="docs/marketing/videos"
          mkdir -p "$DEST"
          rm -f "$DEST"/*.mp4
          cp /tmp/remotion-marketing-out/*.mp4 "$DEST/"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "No marketing asset changes to commit."
            exit 0
          fi
          git commit -m "chore(marketing): Remotion renders for v${VERSION}"
          git push origin main
