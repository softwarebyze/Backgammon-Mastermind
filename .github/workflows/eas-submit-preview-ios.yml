# Submit the latest (or specified) preview iOS build to TestFlight.
# Generates gitignored store.preview.config.json before eas submit (eas.json metadataPath).

name: EAS Submit Preview iOS (TestFlight)

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS build UUID (optional — defaults to latest preview iOS build)'
        required: false
        type: string

jobs:
  submit:
    name: Submit preview iOS to TestFlight
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            exit 1
          fi

      - name: 📦 Checkout project repo
        uses: actions/checkout@v4

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 📦 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📝 Generate preview store config
        run: |
          pnpm metadata:preview-config
          test -f store.preview.config.json

      - name: 🚀 Submit to TestFlight
        env:
          EXPO_PUBLIC_APP_ENV: preview
        run: |
          if [ -n "${{ inputs.build_id }}" ]; then
            eas submit --platform ios --profile preview --id "${{ inputs.build_id }}" --non-interactive
          else
            eas submit --platform ios --profile preview --latest --non-interactive
          fi
