# 🔗 Links:
# Source file: https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/new-github-release.yml
# Starter releasing process: https://starter.obytes.com/ci-cd/app-releasing-process/

# ✍️ Description:
# This workflow will be triggered automatically after the new app version workflow has been executed successfully
# (push of a vX.Y.Z tag, optional prerelease suffix such as v1.3.0-rc.1).
# It will create a new GitHub release with the new app version and the release notes.
# Evidence/QA tags (qa-pr-*, pr-*-evidence, e2e-evidence, qa-bearoff-baseline-*,
# maestro-screenshots, …) must not start with v and do not trigger this workflow.
# See docs/releases.md ("Evidence and QA release tags").

# 🚨 GITHUB SECRETS REQUIRED: None

name: New GitHub Release

on:
  push:
    # Version tags only (v1.2.0, v1.3.0-rc.1). GitHub tag filters are globs, not regex.
    # Evidence/QA tags (qa-pr-*, pr-*-evidence, …) must not use this pattern.
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    name: New GitHub Release
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔎 Check whether the tag already has a release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[].tag_name' | grep -Fqx "$GITHUB_REF_NAME"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🏃‍♂️Create GitHub release if needed
        if: steps.existing-release.outputs.exists != 'true'
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          draft: false
          skipIfReleaseExists: true
