name: Upload Store Screenshots

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target store'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android

jobs:
  screenshots:
    name: Upload ${{ inputs.platform }} screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN secret is required."
            exit 1
          fi

      - name: 📦 Checkout project repo
        uses: actions/checkout@v4

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 💎 Setup Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: 📦 Stage screenshots from marketing source of truth
        run: pnpm screenshots:prepare

      - name: 🔑 Fetch App Store Connect API key from EAS credentials (iOS only)
        if: ${{ inputs.platform == 'ios' }}
        run: pnpm screenshots:asc-key
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 🔑 Unpack Google Play service account (Android only)
        if: ${{ inputs.platform == 'android' }}
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_BASE64 secret is required for Android. Set it to the base64 of the Play Console service-account JSON."
            exit 1
          fi
          mkdir -p .cache
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}" | base64 -d > .cache/google-service-account.json

      - name: 📤 Upload screenshots
        run: bundle exec fastlane ${{ inputs.platform }} screenshots
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLAY_JSON_KEY_PATH: ${{ inputs.platform == 'android' && '.cache/google-service-account.json' || '' }}
