# Retry submission of the latest (or a specified) production iOS EAS build.

name: EAS Submit Production iOS

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS build UUID (optional — defaults to latest production iOS build)'
        required: false
        type: string

jobs:
  submit:
    name: Submit production iOS to App Store Connect
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide the Expo access token as the EXPO_TOKEN repository secret."
            exit 1
          fi

      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Setup Node + pnpm + install dependencies
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit production build
        env:
          EXPO_PUBLIC_APP_ENV: production
        run: |
          if [ -n "${{ inputs.build_id }}" ]; then
            eas submit --platform ios --profile production --id "${{ inputs.build_id }}" --non-interactive
          else
            eas submit --platform ios --profile production --latest --non-interactive
          fi
