name: EAS Production Build and Submit (Android)

on:
  workflow_dispatch:

jobs:
  Build:
    name: Build production Android and submit to Google Play
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🔑 Load Google Play service account from EAS secret
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: ⏱️ EAS Build (AAB) and auto-submit to Google Play
        run: |
          EXPO_PUBLIC_APP_ENV=production eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --auto-submit \
            --message "Build production (Android)"
        shell: bash
