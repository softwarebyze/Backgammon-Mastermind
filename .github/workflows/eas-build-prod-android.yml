name: EAS Production Build and Submit (Android)

on:
  workflow_dispatch:
    inputs:
      submit_existing_build_id:
        description: 'Optional EAS Android build ID to submit without creating another build'
        required: false
        type: string
      build_locally:
        description: 'Build the production AAB on the GitHub runner to bypass the EAS cloud queue'
        required: true
        default: false
        type: boolean
      track:
        description: 'Google Play track to submit to. internal = testers only; production = public release'
        required: true
        default: internal
        type: choice
        options:
          - internal
          - production

jobs:
  Build:
    name: Build production Android and submit to Google Play (${{ inputs.track }})
    runs-on: ubuntu-latest
    env:
      # Submit profile in eas.json: "internal" or "production".
      SUBMIT_PROFILE: ${{ inputs.track }}
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🔑 Authenticate with Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🔑 Unpack Google Play service account
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_BASE64 secret is required."
            exit 1
          fi
          mkdir -p .cache
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_BASE64" | base64 -d > .cache/google-service-account.json
          chmod 600 .cache/google-service-account.json

      - name: ⏱️ EAS Build (AAB) and auto-submit to Google Play (${{ inputs.track }})
        if: ${{ inputs.submit_existing_build_id == '' && inputs.build_locally == false }}
        run: |
          EXPO_PUBLIC_APP_ENV=production eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --auto-submit-with-profile "$SUBMIT_PROFILE" \
            --message "Build production (Android, ${SUBMIT_PROFILE} track)"
        shell: bash

      - name: 🏗️ Build production AAB locally
        if: ${{ inputs.submit_existing_build_id == '' && inputs.build_locally }}
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_PROJECT_ID: '507969'
          POSTHOG_CLI_HOST: https://us.posthog.com
          GITHUB_ACTIONS: 'true'
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          EXPO_PUBLIC_APP_ENV=production eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output ./backgammon-mastermind.aab \
            --message "Build production (Android, local fallback)"
        shell: bash

      - name: 📤 Submit locally built AAB to Google Play
        if: ${{ inputs.submit_existing_build_id == '' && inputs.build_locally }}
        run: |
          EXPO_PUBLIC_APP_ENV=production eas submit \
            --platform android \
            --profile "$SUBMIT_PROFILE" \
            --path ./backgammon-mastermind.aab \
            --non-interactive \
            --no-wait
        shell: bash

      - name: 📤 Submit existing AAB to Google Play
        if: ${{ inputs.submit_existing_build_id != '' }}
        run: |
          EXPO_PUBLIC_APP_ENV=production eas submit \
            --platform android \
            --profile "$SUBMIT_PROFILE" \
            --id "${{ inputs.submit_existing_build_id }}" \
            --non-interactive \
            --no-wait
        shell: bash
