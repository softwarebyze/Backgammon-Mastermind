# Open Sage native verification for engine and game changes in PRs.
# - Android: full Gradle APK build (compiles Kotlin + JNI + the bgsage C++
#   engine for real), then a Maestro flow on an emulator drives the Sage Lab
#   screen and asserts the engine's actual move output.
# - iOS: Expo prebuild + xcodebuild for the iOS simulator (compiles the
#   Swift/ObjC++ bridge + engine for real). No signing, no EAS, no Apple creds.
#   The Release build is then run through the Maestro smoke flow on an iPhone
#   and an iPad simulator; screenshots upload as `maestro-visual-report-ios`.

name: bgsage native verify

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # This job runs `pnpm type-check` over the whole app and builds both native
    # targets, so it is sensitive to any app source or build config — not just
    # the engine. The previous list named a handful of specific paths and
    # silently skipped ~110 changed files per PR, including the Maestro runner
    # and the shared CI actions this workflow calls.
    paths:
      - '.github/**'
      - '.maestro/**'
      - 'app.config.ts'
      - 'babel.config.js'
      - 'expo-bgsage/**'
      - 'metro.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'tsconfig.test.json'

concurrency:
  group: bgsage-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android — APK build + Maestro engine test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch bgsage engine (pinned commit)
        # Same script as the repo preinstall. Running it here, before
        # pnpm install, means the file: copy of expo-bgsage already
        # contains the C++ sources. preinstall then sees the pin and skips.
        run: bash .github/scripts/fetch-bgsage-engine.sh

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Verify vendored engine in node_modules
        run: |
          test -f node_modules/expo-bgsage/vendor/bgsage/cpp/src/board.cpp || { echo "::error::expo-bgsage vendor sources missing from node_modules copy"; exit 1; }
          test -f node_modules/expo-bgsage/ios/vendor/bgsage/cpp/src/mobile.cpp || { echo "::error::expo-bgsage iOS vendor sources missing from node_modules copy"; exit 1; }

      - name: Build expo-bgsage TS
        run: ./node_modules/.bin/tsc -p expo-bgsage/tsconfig.json

      - name: Type-check app (covers sage-lab-section)
        run: pnpm type-check

      - name: Set Up JDK + Generate Test APK
        uses: ./.github/actions/setup-jdk-generate-apk
        with:
          APP_ENV: preview

      - name: Upload Test APK
        uses: actions/upload-artifact@v4
        with:
          name: bgsage-test-apk
          path: ./android-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Install Maestro
        run: npm run install-maestro

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM (hardware emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pre-install Android system image (retry)
        run: bash .github/scripts/install-android-system-image.sh 34 google_apis x86_64

      - name: Run Sage engine flow with Maestro
        id: maestro_emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          working-directory: ${{ github.workspace }}
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          cores: 2
          ram-size: 4096M
          script: bash .github/scripts/run-maestro-sage-emulator.sh "${{ github.workspace }}" com.backgammonmastermind.preview

      - name: Upload Maestro logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bgsage-maestro-logs
          path: |
            .maestro-ci-output/**
            report.xml
            e2e-recording.mp4
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: iOS — release simulator smoke
    # macos-26 = Xcode 26 / Swift 6.2 (GA Feb 2026). Required: expo-modules-jsi
    # declares swift-tools-version 6.2 and uses 6.2-only compiler features.
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch bgsage engine (pinned commit)
        # Same script as preinstall. See the android job.
        run: bash .github/scripts/fetch-bgsage-engine.sh

      - name: Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: Verify vendored engine in node_modules
        run: |
          test -f node_modules/expo-bgsage/vendor/bgsage/cpp/src/board.cpp || { echo "::error::expo-bgsage vendor sources missing from node_modules copy"; exit 1; }
          test -f node_modules/expo-bgsage/ios/vendor/bgsage/cpp/src/mobile.cpp || { echo "::error::expo-bgsage iOS vendor sources missing from node_modules copy"; exit 1; }

      - name: Build expo-bgsage TS
        run: ./node_modules/.bin/tsc -p expo-bgsage/tsconfig.json

      - name: Generate brand assets
        run: pnpm brand:generate
        env:
          EXPO_NO_DOTENV: '1'
          APP_ENV: preview
          CI: 'true'

      - name: Prebuild native project
        run: |
          for attempt in 1 2 3; do
            rm -rf ios android
            if pnpm prebuild:preview; then
              exit 0
            fi
            echo "::warning::prebuild attempt ${attempt} failed; retrying..."
            sleep 5
          done
          exit 1
        env:
          EXPO_NO_DOTENV: '1'
          APP_ENV: preview
          CI: 'true'

      - name: Install CocoaPods dependencies
        run: cd ios && pod install
        env:
          CI: 'true'

      - name: Build for iOS simulator (compile check)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          echo "workspace: $WORKSPACE"
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/^ *Schemes:$/{f=1;next} f && NF{print $1; exit}')
          echo "scheme: $SCHEME"
          # Runner images don't guarantee a specific simulator device name
          # (macos-26 ships no iPhone 16) — pick any available iPhone by UDID.
          DEVICE_UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for runtime in sorted(d['devices']):
              if 'iOS' not in runtime:
                  continue
              for dev in d['devices'][runtime]:
                  if 'iPhone' in dev['name']:
                      print(dev['udid'])
                      sys.exit(0)
          sys.exit('no available iPhone simulator found')
          ")
          echo "simulator UDID: $DEVICE_UDID"
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/bgsage-dd" \
            ONLY_ACTIVE_ARCH=YES \
            build
        env:
          # Release embeds the JS bundle (no Metro / dev-client launcher), so
          # the Maestro step below can launch the app straight to the home screen.
          # ONLY_ACTIVE_ARCH=YES keeps Release to the runner's arm64 slice like
          # Debug does; the x86_64 slice fails on the engine's AVX code.
          EXPO_NO_DOTENV: '1'
          APP_ENV: preview
          EXPO_PUBLIC_APP_ENV: preview
          CI: 'true'

      - name: Install Maestro
        run: |
          npm run install-maestro
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run backgammon smoke on iPhone + iPad simulators
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/bgsage-dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "app: $APP"
          # Validate the compiled Release plist, not just the prebuild config.
          python3 - "$APP/Info.plist" <<'PYCODE'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as source:
              plist = plistlib.load(source)
          assert '_expo._tcp' not in plist.get('NSBonjourServices', []), 'dev Bonjour service in Release app'
          assert not plist.get('NSLocalNetworkUsageDescription', '').startswith('Expo Dev Launcher'), 'dev network description in Release app'
          print('Compiled Release plist: dev-launcher network keys absent')
          PYCODE
          bash .github/scripts/run-maestro-ios-sim-smoke.sh "$GITHUB_WORKSPACE" "$APP" com.backgammonmastermind.preview "$GITHUB_WORKSPACE/.maestro/app/ios-release-settings.yaml" "$GITHUB_WORKSPACE/.maestro/app/ios-confirm-move.yaml"

      - name: Upload iOS Maestro screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-visual-report-ios
          path: maestro-ios-output/**
          if-no-files-found: warn
          retention-days: 14
