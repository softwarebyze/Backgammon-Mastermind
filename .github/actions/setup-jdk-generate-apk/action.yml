# Generates a debug APK for Maestro E2E (faster than release; no signing overhead).
# Output: ./android-test.apk (also at android/app/build/outputs/apk/debug/app-debug.apk)

name: 'Setup JDK + GRADLE + Generate APK'
description: Prebuild native project and assemble a debug APK for E2E
inputs:
  APP_ENV:
    description: 'APP_ENV (one of): development, preview, production'
    required: true
    default: preview

runs:
  using: composite
  steps:
    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Generate brand assets
      run: pnpm brand:generate
      shell: bash

    - name: Prebuild native project
      run: pnpm prebuild:${{ inputs.APP_ENV }}
      shell: bash
      env:
        EXPO_NO_DOTENV: '1'
        APP_ENV: ${{ inputs.APP_ENV }}
        CI: 'true'

    - name: Tune Gradle for CI
      run: bash .github/scripts/tune-android-gradle-for-ci.sh android/gradle.properties
      shell: bash

    - name: Pin react-native path for native module Gradle scripts
      run: |
        APP_GRADLE=android/app/build.gradle
        if ! grep -q 'REACT_NATIVE_NODE_MODULES_DIR' "$APP_GRADLE"; then
          sed -i '/^react {/i ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native")\n' "$APP_GRADLE"
        fi
      shell: bash

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-read-only: false

    - name: Build debug test APK
      working-directory: android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon --build-cache --stacktrace
      shell: bash

    - name: Copy test APK to workspace root
      run: cp android/app/build/outputs/apk/debug/app-debug.apk ./android-test.apk
      shell: bash
