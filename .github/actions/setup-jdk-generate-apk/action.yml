# Generates a release APK for Maestro E2E (embedded JS bundle; skips dev-client launcher).
# Output: ./android-test.apk (from android/app/build/outputs/apk/release/app-release.apk)

name: 'Setup JDK + GRADLE + Generate APK'
description: Prebuild native project and assemble a debug APK for E2E
inputs:
  APP_ENV:
    description: 'APP_ENV (one of): development, preview, production'
    required: true
    default: preview

runs:
  using: composite
  steps:
    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Generate brand assets
      run: pnpm brand:generate
      shell: bash

    - name: Prebuild native project
      run: pnpm prebuild:${{ inputs.APP_ENV }}
      shell: bash
      env:
        EXPO_NO_DOTENV: '1'
        APP_ENV: ${{ inputs.APP_ENV }}
        CI: 'true'

    - name: Tune Gradle for CI
      run: bash .github/scripts/tune-android-gradle-for-ci.sh android/gradle.properties
      shell: bash

    - name: Patch app Gradle for CI (RN path + embedded JS bundle)
      run: |
        APP_GRADLE=android/app/build.gradle
        if ! grep -q 'REACT_NATIVE_NODE_MODULES_DIR' "$APP_GRADLE"; then
          sed -i '/^react {/i ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native")\n' "$APP_GRADLE"
        fi
        # Embed the JS bundle in debug APK so Maestro can run without Metro (expo-dev-client).
        if ! grep -q 'debuggableVariants = \[\]' "$APP_GRADLE"; then
          sed -i '/bundleCommand = "export:embed"/a\    debuggableVariants = []' "$APP_GRADLE"
        fi
      shell: bash

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-read-only: false

    - name: Build release test APK (embedded bundle, no dev-client launcher)
      working-directory: android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease --no-daemon --build-cache --stacktrace
      shell: bash

    - name: Copy test APK to workspace root
      run: cp android/app/build/outputs/apk/release/app-release.apk ./android-test.apk
      shell: bash
