# Generates a preview Release APK for Maestro E2E (embedded JS, no Metro runtime).
# Output: ./android-test.apk (from android/app/build/outputs/apk/release/app-release.apk)

name: 'Setup JDK + GRADLE + Generate APK'
description: Build an embedded Release APK for Maestro or a Metro Debug APK for Screenmap
inputs:
  APP_ENV:
    description: 'APP_ENV (one of): development, preview, production'
    required: true
    default: preview
  APK_VARIANT:
    description: 'release (embedded JS, no dev client) or debug (Metro and dev client)'
    required: false
    default: release

runs:
  using: composite
  steps:
    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Generate brand assets
      run: pnpm brand:generate
      shell: bash

    - name: Prebuild native project
      run: |
        # The Release APK embeds its JS bundle and runs without Metro. Leaving
        # expo-dev-client linked here makes its launcher cast the production
        # Expo Updates controller to UpdatesDevLauncherInterface and crash
        # before React starts, so omit the dev client from this CI-only build.
        case "${{ inputs.APK_VARIANT }}" in
          release) pnpm remove expo-dev-client ;;
          debug) ;; # Screenmap connects the dev client to Metro.
          *) echo "::error::APK_VARIANT must be release or debug"; exit 1 ;;
        esac
        # app-icon-badge + Android icon generation can intermittently fail with
        # "Could not find MIME for Buffer <null>" on a cold CI checkout.
        for attempt in 1 2 3; do
          rm -rf ios android
          if pnpm prebuild:${{ inputs.APP_ENV }}; then
            exit 0
          fi
          echo "::warning::prebuild attempt ${attempt} failed; retrying..."
          sleep 5
        done
        exit 1
      shell: bash
      env:
        EXPO_NO_DOTENV: '1'
        APP_ENV: ${{ inputs.APP_ENV }}
        CI: 'true'

    - name: Tune Gradle for CI
      run: bash .github/scripts/tune-android-gradle-for-ci.sh android/gradle.properties
      shell: bash

    - name: Patch app Gradle for CI (RN path + embedded JS bundle)
      run: |
        APP_GRADLE=android/app/build.gradle
        if ! grep -q 'REACT_NATIVE_NODE_MODULES_DIR' "$APP_GRADLE"; then
          # Worklets 0.10 reads this extension as a String; passing Gradle's File
          # object causes a ClassCastException while configuring the Android build.
          sed -i '/^react {/i ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native").absolutePath\n' "$APP_GRADLE"
        fi
        # Screenmap needs Debug to request JS from Metro. Maestro's Release
        # build embeds JS and must continue to run independently of Metro.
        if [ "${{ inputs.APK_VARIANT }}" = release ] && ! grep -q 'debuggableVariants = \[\]' "$APP_GRADLE"; then
          sed -i '/bundleCommand = "export:embed"/a\    debuggableVariants = []' "$APP_GRADLE"
        fi
      shell: bash

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-read-only: false

    - name: Build test APK
      run: bash .github/scripts/assemble-android-test-apk.sh "$GITHUB_WORKSPACE" "${{ inputs.APK_VARIANT }}"
      shell: bash
