# Generates a debug APK for Maestro E2E (embedded JS bundle via debuggableVariants=[]).
# Output: ./android-test.apk (from android/app/build/outputs/apk/debug/app-debug.apk)

name: 'Setup JDK + GRADLE + Generate APK'
description: Prebuild native project and assemble a debug APK for E2E
inputs:
  APP_ENV:
    description: 'APP_ENV (one of): development, preview, production'
    required: true
    default: preview

runs:
  using: composite
  steps:
    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Generate brand assets
      run: pnpm brand:generate
      shell: bash

    - name: Prebuild native project for embedded E2E bundle
      run: |
        # app-icon-badge + Android icon generation can intermittently fail with
        # "Could not find MIME for Buffer <null>" on a cold CI checkout.
        for attempt in 1 2 3; do
          rm -rf ios android
          if pnpm prebuild:${{ inputs.APP_ENV }}; then
            exit 0
          fi
          echo "::warning::prebuild attempt ${attempt} failed; retrying..."
          sleep 5
        done
        exit 1
      shell: bash
      env:
        EXPO_NO_DOTENV: '1'
        APP_ENV: ${{ inputs.APP_ENV }}
        CI: 'true'
        # expo-updates runs the embedded JS in debug rather than launching the
        # installed dev client, so Maestro does not need Metro.
        E2E_NATIVE_DEBUG: '1'

    - name: Tune Gradle for CI
      run: bash .github/scripts/tune-android-gradle-for-ci.sh android/gradle.properties
      shell: bash

    - name: Patch app Gradle for CI (RN path + embedded JS bundle)
      run: |
        APP_GRADLE=android/app/build.gradle
        if ! grep -q 'REACT_NATIVE_NODE_MODULES_DIR' "$APP_GRADLE"; then
          sed -i '/^react {/i ext.REACT_NATIVE_NODE_MODULES_DIR = file("../../node_modules/react-native")\n' "$APP_GRADLE"
        fi
        # Embed the JS bundle in the debug APK so Maestro can run without Metro.
        if ! grep -q 'debuggableVariants = \[\]' "$APP_GRADLE"; then
          sed -i '/bundleCommand = "export:embed"/a\    debuggableVariants = []' "$APP_GRADLE"
        fi
      shell: bash

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-read-only: false

    - name: Build debug test APK (embedded JS bundle)
      working-directory: android
      run: |
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon --build-cache --stacktrace
      shell: bash

    - name: Copy test APK to workspace root
      run: cp android/app/build/outputs/apk/debug/app-debug.apk ./android-test.apk
      shell: bash
