appId: ${APP_ID}
tags:
  - smoke
  - pull-request
---
# Fast computer was a settings toggle. Pace is now one default, so the row is gone.
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: vs Computer
- tapOn:
    id: open-settings-button
- extendedWaitUntil:
    visible:
      id: stack-escape-button
    timeout: 20000
# Difficulty occupies the first viewport on small Android screens.
- scrollUntilVisible:
    element:
      text: Move hints
    direction: DOWN
- assertVisible:
    text: Move hints
    checked: false
- tapOn: Move hints
- assertVisible:
    text: Move hints
    checked: true
- tapOn: Move hints
- assertVisible:
    text: Move hints
    checked: false
- scrollUntilVisible:
    element:
      text: Auto-roll dice
    direction: DOWN
- assertVisible: Auto-roll dice
- scrollUntilVisible:
    element:
      text: Auto-move when forced
    direction: DOWN
- assertVisible: Auto-move when forced
- assertNotVisible: Fast computer
- scrollUntilVisible:
    element:
      text: Dice display
    direction: DOWN
- assertNotVisible: Fast computer
- assertVisible: Dice display
- takeScreenshot: settings-no-fast-mode
