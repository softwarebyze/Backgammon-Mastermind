appId: ${APP_ID}
tags:
  - smoke
  - pull-request
---
# Fast computer was a settings toggle. Pace is now one default, so the row is gone.
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: vs Computer
- tapOn:
    id: open-settings-button
- extendedWaitUntil:
    visible: Move hints
    timeout: 20000
- scrollUntilVisible:
    element:
      text: Dice display
    direction: DOWN
- assertNotVisible: Fast computer
# The dice-order row makes this section taller on short phones. Bring the
# preferences back into view before asserting their visibility.
- scrollUntilVisible:
    element:
      text: Auto-roll dice
    direction: UP
- assertVisible: Auto-roll dice
- assertVisible: Auto-move when forced
- takeScreenshot: settings-no-fast-mode
