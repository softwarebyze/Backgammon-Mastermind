appId: ${APP_ID}
tags:
  - smoke
  - pull-request
---
# Fast computer was a settings toggle. Pace is now one default, so the row is gone.
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: Play against the computer
- tapOn:
    id: open-settings-button
- extendedWaitUntil:
    visible: Move hints
    timeout: 20000
- scrollUntilVisible:
    element:
      text: Auto-move when forced
    direction: DOWN
- assertVisible: Auto-roll dice
- assertNotVisible: Fast computer
# The computer level and dice pickers sit below the toggles.
- scrollUntilVisible:
    element:
      text: Dice display
    direction: DOWN
- assertNotVisible: Fast computer
- takeScreenshot: settings-no-fast-mode
