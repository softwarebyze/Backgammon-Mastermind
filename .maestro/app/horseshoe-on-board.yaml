# Capture the direction/horseshoe overlay on an active game board for visual QA.
# Opens Settings from a live game, enables Direction overlay, returns, and screenshots.
appId: ${APP_ID}
tags:
  - pull-request
---
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: vs Computer
- tapOn:
    text: vs Computer
- extendedWaitUntil:
    visible:
      id: point-1
    timeout: 45000
- tapOn:
    text: Settings
- extendedWaitUntil:
    visible:
      id: stack-escape-button
    timeout: 15000
# The difficulty picker can fill the initial Settings viewport.
- scrollUntilVisible:
    element:
      text: Direction overlay
    direction: DOWN
- assertVisible:
    text: Direction overlay
    checked: false
- tapOn:
    text: Direction overlay
- assertVisible:
    text: Direction overlay
    checked: true
- tapOn:
    id: stack-escape-button
- extendedWaitUntil:
    visible:
      id: point-1
    timeout: 15000
# Overlay is hidden during opening-roll — roll through like smoke does.
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: roll-dice-button
          commands:
            - tapOn:
                id: roll-dice-button
      - runFlow:
          when:
            visible: No legal moves
          commands:
            - extendedWaitUntil:
                notVisible: No legal moves
                timeout: 5000
- extendedWaitUntil:
    visible:
      id: direction-overlay
    timeout: 90000
- takeScreenshot: horseshoe-on-board
