# Real-engine cube Tutor: missed double, bad take, bad double, beaver and undo.
appId: ${APP_ID}
tags:
  - pull-request
---
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: Play against the computer
- tapOn: Settings
- scrollUntilVisible:
    element:
      text: Tutor mode
    direction: DOWN
- tapOn: Tutor mode
- scrollUntilVisible:
    element:
      text: Auto-roll dice
    direction: DOWN
- tapOn: Auto-roll dice
- tapOn:
    id: stack-escape-button
- runScript: ../utils/money-position-link.js
- runFlow:
    file: ../utils/play-money-position.yaml
    env:
      POSITION_LINK: ${output.moneyTutorLink}
- tapOn:
    id: roll-dice-button
- extendedWaitUntil:
    visible:
      id: cube-tutor-reveal
    timeout: 45000
- tapOn:
    id: cube-tutor-reveal
- assertVisible:
    id: cube-tutor-recommendation
    text: Double
- takeScreenshot: cube-tutor-missed-double
- tapOn:
    id: cube-tutor-cancel
- assertVisible: Cube 1 · Center
- tapOn:
    id: match-double
- extendedWaitUntil:
    visible:
      id: match-accept
    timeout: 45000
- tapOn:
    id: match-accept
- extendedWaitUntil:
    visible:
      id: cube-tutor-reveal
    timeout: 45000
- tapOn:
    id: cube-tutor-reveal
- assertVisible:
    id: cube-tutor-recommendation
    text: Pass
- takeScreenshot: cube-tutor-bad-take
- tapOn:
    id: cube-tutor-cancel
- tapOn:
    id: match-drop
- extendedWaitUntil:
    visible: White wins 1 · Pass
    timeout: 45000
- runFlow:
    file: ../utils/play-money-position.yaml
    env:
      POSITION_LINK: ${output.moneyBeaverLink}
- tapOn:
    id: match-double
- extendedWaitUntil:
    visible:
      id: cube-tutor-reveal
    timeout: 45000
- tapOn:
    id: cube-tutor-reveal
- assertVisible:
    id: cube-tutor-recommendation
    text: No double
- takeScreenshot: cube-tutor-bad-double
- tapOn:
    id: cube-tutor-continue
- extendedWaitUntil:
    visible:
      id: match-beaver
    timeout: 45000
- tapOn:
    id: cube-hint-button
- extendedWaitUntil:
    visible:
      id: cube-hint-result
      text: Redouble
    timeout: 45000
- takeScreenshot: cube-beaver-hint
- tapOn:
    id: cube-hint-dismiss
- tapOn:
    id: match-beaver
- extendedWaitUntil:
    visible: '.*Black keeps the cube.*'
    timeout: 45000
- takeScreenshot: cube-beaver-pending
- tapOn:
    id: match-drop
- extendedWaitUntil:
    visible: Black wins 2 · Pass
    timeout: 45000
- takeScreenshot: cube-beaver-drop
- tapOn:
    id: header-undo-button
- assertVisible:
    id: match-accept
- assertVisible: '.*Black keeps the cube.*'
- tapOn:
    id: header-redo-button
- assertVisible: Black wins 2 · Pass
- takeScreenshot: cube-beaver-redo

# Validate the full beaver event history across a real cold launch.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: resume-game-button
    timeout: 45000
- tapOn:
    id: resume-game-button
- assertVisible: Black wins 2 · Pass
- takeScreenshot: cube-beaver-cold-restored
# Match checker advice remains available with Tutor enabled after rolling.
- runFlow:
    file: ../utils/play-money-position.yaml
    env:
      POSITION_LINK: ${output.matchCheckerLink}
- extendedWaitUntil:
    visible:
      id: hint-button
    timeout: 45000
- tapOn:
    id: hint-button
- extendedWaitUntil:
    visible:
      id: hint-result
    timeout: 45000
- assertVisible: 'Match to 5.*'
- takeScreenshot: cube-match-checker-hint
