# Capture the directional undo/redo affordances in English and Hebrew.
appId: ${APP_ID}
tags:
  - settings
  - i18n
  - rtl
  - pull-request
---
# `clearState` clears app data *before* stopping the app. When the previous flow
# left the app in the foreground, Android tears the old task down while the new
# process is starting and kills it ("start not valid, killing pid=…"), leaving a
# splash screen for the full timeout. Stop first to remove the race; retry in case
# the platform still loses the launch.
- retry:
    maxRetries: 2
    commands:
      - stopApp
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: vs Computer
          timeout: 60000
- tapOn: vs Computer
- assertVisible: Undo move
- assertVisible: Redo move
- takeScreenshot: undo-redo-01-english
- retry:
    maxRetries: 2
    commands:
      - stopApp
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: vs Computer
          timeout: 60000
- tapOn: Settings
- tapOn: Language
- scrollUntilVisible:
    element:
      text: עברית
    direction: DOWN
- tapOn: עברית
- stopApp
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: נגד המחשב
          timeout: 60000
- tapOn: נגד המחשב
- assertVisible: ביטול המהלך
- assertVisible: ביצוע המהלך מחדש
- takeScreenshot: undo-redo-02-hebrew-rtl
