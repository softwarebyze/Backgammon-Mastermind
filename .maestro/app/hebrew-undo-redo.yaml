# Capture the directional undo/redo affordances in English and Hebrew.
appId: ${APP_ID}
tags:
  - settings
  - i18n
  - rtl
  - pull-request
---
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: vs Computer
- tapOn: vs Computer
- assertVisible: Undo move
- assertVisible: Redo move
- takeScreenshot: undo-redo-01-english
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: vs Computer
- tapOn: Settings
- tapOn: Language
- scrollUntilVisible:
    element:
      text: עברית
    direction: DOWN
- tapOn: עברית
- stopApp
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'false'
      HOME_TEXT: נגד המחשב
- tapOn: נגד המחשב
- assertVisible: ביטול המהלך
- assertVisible: ביצוע המהלך מחדש
- takeScreenshot: undo-redo-02-hebrew-rtl
