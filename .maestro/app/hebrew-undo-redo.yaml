# Capture the directional undo/redo affordances in English and Hebrew.
appId: ${APP_ID}
tags:
  - settings
  - i18n
  - rtl
  - pull-request
---
# Android can kill the process while clearing data and leave the app stuck on
# launch; relaunch up to twice if the home screen does not appear.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: vs Computer
          timeout: 60000
- tapOn: vs Computer
- assertVisible: Undo move
- assertVisible: Redo move
- takeScreenshot: undo-redo-01-english
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
      - extendedWaitUntil:
          visible: vs Computer
          timeout: 60000
- tapOn: Settings
- tapOn: Language
- scrollUntilVisible:
    element:
      text: עברית
    direction: DOWN
- tapOn: עברית
- stopApp
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: נגד המחשב
          timeout: 60000
- tapOn: נגד המחשב
- assertVisible: ביטול המהלך
- assertVisible: ביצוע המהלך מחדש
- takeScreenshot: undo-redo-02-hebrew-rtl
