appId: ${APP_ID}
tags:
  - smoke
  - pull-request
---
# Finish removing the previous Android task before clearing/relaunching.
- stopApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: Play against the computer
# The title shrinks to fit rather than breaking a word on narrow phones.
- assertVisible:
    id: home-title
- takeScreenshot: 01-home-loaded
- tapOn:
    text: Play against the computer
# iOS exposes the board as one accessibility group; individual point IDs are
# Android-only in this hierarchy. Wait for the shared game board slot.
# Auto-roll is on by default, so the roll button may already be gone.
- extendedWaitUntil:
    visible:
      id: game-board-slot
    timeout: 45000
- takeScreenshot: 02-game-board
- assertVisible:
    id: strategy-line
# Issue #308: no disclosure glyph after the strategy name.
- assertNotVisible: '.*[▸◂].*'
# Opening roll + ties + confirm-move (on by default): tap roll / confirm when shown
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: roll-dice-button
          commands:
            - tapOn:
                id: roll-dice-button
      - runFlow:
          when:
            visible:
              id: confirm-move-button
          commands:
            - tapOn:
                id: confirm-move-button
      - runFlow:
          when:
            visible: No legal moves
          commands:
            - extendedWaitUntil:
                notVisible: No legal moves
                timeout: 5000
- extendedWaitUntil:
    visible:
      id: game-board-slot
    timeout: 90000
- takeScreenshot: 03-after-opening
- assertVisible:
    id: game-board-slot
- takeScreenshot: 04-smoke-complete
