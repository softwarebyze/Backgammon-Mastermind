appId: ${APP_ID}
tags:
  - smoke
  - pull-request
---
# Finish removing the previous Android task before clearing/relaunching.
- stopApp
- waitForAnimationToEnd:
    timeout: 5000
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: vs Computer
    timeout: 90000
- takeScreenshot: 01-home-loaded
- tapOn:
    text: vs Computer
# Auto-roll is on by default, so the roll button may already be gone.
- extendedWaitUntil:
    visible:
      id: point-1
    timeout: 45000
- takeScreenshot: 02-game-board
- assertVisible:
    id: strategy-line
# Opening roll + ties + confirm-move (on by default): tap roll / confirm when shown
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible:
              id: roll-dice-button
          commands:
            - tapOn:
                id: roll-dice-button
                optional: true
      - runFlow:
          when:
            visible:
              id: confirm-move-button
          commands:
            - tapOn:
                id: confirm-move-button
      - runFlow:
          when:
            visible: No legal moves
          commands:
            - extendedWaitUntil:
                notVisible: No legal moves
                timeout: 5000
- extendedWaitUntil:
    visible:
      id: point-1
    timeout: 90000
- takeScreenshot: 03-after-opening
- assertVisible:
    id: point-1
- takeScreenshot: 04-smoke-complete
