appId: ${APP_ID}
tags:
  - smoke
  - pull-request
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: vs Computer
    timeout: 90000
- takeScreenshot: 01-home-loaded
- tapOn:
    text: vs Computer
- extendedWaitUntil:
    visible:
      id: roll-dice-button
    timeout: 45000
- takeScreenshot: 02-game-board
- tapOn:
    id: roll-dice-button
- extendedWaitUntil:
    notVisible:
      id: roll-dice-button
    timeout: 30000
- takeScreenshot: 03-after-opening
- assertVisible: Point 1
- takeScreenshot: 04-smoke-complete
