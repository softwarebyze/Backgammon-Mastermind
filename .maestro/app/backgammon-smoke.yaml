appId: ${APP_ID}
tags:
  - smoke
  - pull-request
---
# Finish removing the previous Android task before clearing/relaunching.
- stopApp
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: Play against the computer
- takeScreenshot: 01-home-loaded
- tapOn:
    text: Play against the computer
- scrollUntilVisible:
    element:
      id: home-start-game
    direction: DOWN
- tapOn:
    id: home-start-game
# Wait for the shared game board slot. Individual points remain accessible.
# Auto-roll is on by default, so the roll button may already be gone.
- extendedWaitUntil:
    visible:
      id: game-board-slot
    timeout: 45000
- takeScreenshot: 02-game-board
- assertVisible:
    id: strategy-line
# Default Auto-roll owns the opening (including ties and Black's first turn).
# Wait for the stable human moving phase; a manual Roll tap races the timer.
- extendedWaitUntil:
    visible:
      id: game-action-caption
      text: Move your white checkers
    timeout: 90000
- assertVisible:
    id: game-dice-tray
- takeScreenshot: 03-after-opening
- assertVisible:
    id: game-board-slot
- takeScreenshot: 04-smoke-complete
