appId: ${APP_ID}
tags:
  - smoke
  - pull-request
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: vs Computer
    timeout: 90000
- takeScreenshot: 01-home-loaded
- tapOn:
    text: vs Computer
- extendedWaitUntil:
    visible:
      id: roll-dice-button
    timeout: 45000
- takeScreenshot: 02-game-board
# Opening roll + ties + no-move: tap while roll/end-turn visible, then wait for board
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            visible:
              id: roll-dice-button
          commands:
            - tapOn:
                id: roll-dice-button
      - runFlow:
          when:
            visible:
              id: end-turn-button
          commands:
            - tapOn:
                id: end-turn-button
- extendedWaitUntil:
    visible: Point 1
    timeout: 90000
- takeScreenshot: 03-after-opening
- assertVisible: Point 1
- takeScreenshot: 04-smoke-complete
