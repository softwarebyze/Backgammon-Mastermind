appId: ${APP_ID}
tags:
  - smoke
  - pull-request
---
- launchApp
- runFlow:
    when:
      visible: BackgammonMastermind
    commands:
      - tapOn: BackgammonMastermind
- extendedWaitUntil:
    visible: vs Computer
    timeout: 60000
- tapOn:
    text: vs Computer
- extendedWaitUntil:
    visible: Roll Dice
    timeout: 30000
- tapOn: Roll Dice
- extendedWaitUntil:
    visible: Tap one of your checkers
    timeout: 15000
- assertVisible: Point 1
