appId: ${APP_ID}
tags:
  - smoke
  - pull-request
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: Development Build
    commands:
      - tapOn: BackgammonMastermind
- runFlow:
    when:
      visible:
        text: "http.*"
    commands:
      - tapOn:
          text: "http.*"
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- extendedWaitUntil:
    visible: vs Computer
    timeout: 90000
- tapOn:
    text: vs Computer
- extendedWaitUntil:
    visible: Roll Dice
    timeout: 30000
- tapOn: Roll Dice
- extendedWaitUntil:
    visible: Tap one of your checkers
    timeout: 15000
- assertVisible: Point 1
