# iOS groups the board accessibility children. Capture the editor on both
# iPhone and iPad without relying on Android-only individual point targets.
appId: ${APP_ID}
tags:
  - ios
---
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: Play against the computer
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-setup-button
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-setup-button
- extendedWaitUntil:
    visible:
      id: position-screen
    timeout: 30000
- assertVisible:
    id: position-paint-white
- assertVisible:
    id: position-paint-black
- takeScreenshot: position-ios-01-editor
- assertVisible:
    id: position-score-toggle
- assertVisible:
    id: position-cube
- assertNotVisible:
    id: position-match-length
- assertNotVisible:
    id: position-cube-value-higher
- assertNotVisible:
    id: position-start
- takeScreenshot: position-compact-workspace
- assertVisible:
    id: position-standard
- assertVisible:
    id: position-empty
- assertVisible:
    id: position-die-0
- assertNotVisible:
    id: position-fine-tune
- tapOn:
    id: position-dice-toggle
- tapOn:
    id: position-die-0-value-6
- tapOn:
    id: position-die-1-value-2
- tapOn:
    id: position-detail-done
- assertVisible:
    id: position-dice-toggle
    text: 'Dice: 6, 2'
- takeScreenshot: position-visible-presets-dice
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-cube
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-cube
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-cube-value-higher
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-cube-value-higher
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-cube-owner-black
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-cube-owner-black
- assertVisible:
    id: position-cube
    text: 'Doubling cube: 2. Cube owner: Black'
- takeScreenshot: position-visual-cube
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-cube-reset
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-cube-reset
- tapOn:
    id: position-cube
- runFlow: ../utils/position-score.yaml
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-empty
      START_Y: '25%'
      END_Y: '80%'
- tapOn:
    id: position-empty
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-paint-white
      START_Y: '25%'
      END_Y: '80%'
- takeScreenshot: position-ios-02-empty
- runFlow: ../utils/position-bar.yaml
- runFlow: ../utils/position-drag.yaml
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-standard
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-standard
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-paint-white
      START_Y: '25%'
      END_Y: '80%'
- runScript: ../utils/position-link.js
- openLink: ${output.sharedPositionLink}
# iOS asks for consent the first time this simulator opens the app by link.
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- launchApp:
    stopApp: false
# After returning through iOS's link prompt, XCTest can retain the previous
# accessibility snapshot. Scrolling refreshes it and verifies the payload's
# actual roll instead of relying only on a changed caption.
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-die-0
      START_Y: '80%'
      END_Y: '25%'
- assertVisible:
    id: position-dice-toggle
    text: 'Dice: 5, 2'
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-paint-white
      START_Y: '25%'
      END_Y: '80%'
- assertVisible:
    id: position-screen
- takeScreenshot: position-ios-03-shared
