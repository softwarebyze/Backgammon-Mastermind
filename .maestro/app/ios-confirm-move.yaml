# iOS board points are grouped in accessibility. Device-specific tap locations
# target the deterministic fixture; inspect recorded checker counts and handoff.
appId: ${APP_ID}
tags:
  - ios
  - pull-request
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Play against the computer
    timeout: 90000
- openLink: backgammonmastermind.preview://developer
- scrollUntilVisible:
    element:
      id: developer-json-input
    direction: DOWN
    timeout: 60000
- longPressOn:
    id: developer-json-input
- tapOn: (?i)select all
- eraseText: 1
- inputText: '{"useStandardSetup":true,"dice":[3,1],"mode":"vs-human"}'
- hideKeyboard
- tapOn:
    id: developer-load-json
- extendedWaitUntil:
    visible:
      id: game-board-slot
    timeout: 20000
- takeScreenshot: ios-confirm-01-fixed-roll
- tapOn:
    point: ${POINT_8}
- tapOn:
    point: ${POINT_5}
- assertVisible: Undo move
- takeScreenshot: ios-confirm-02-first-move
- tapOn: Undo move
- takeScreenshot: ios-confirm-03-undo-restored
- tapOn:
    point: ${POINT_8}
- tapOn:
    point: ${POINT_5}
- tapOn:
    point: ${POINT_6}
- tapOn:
    point: ${POINT_5}
- extendedWaitUntil:
    visible:
      id: confirm-move-button
    timeout: 15000
- assertNotVisible: ".*Black's turn.*"
- takeScreenshot: ios-confirm-04-held-turn
- tapOn:
    id: confirm-move-button
- extendedWaitUntil:
    visible: ".*Black's turn.*"
    timeout: 15000
- takeScreenshot: ios-confirm-05-black-handoff
