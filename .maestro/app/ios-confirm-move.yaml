# iOS board points are grouped in accessibility. Device-specific tap locations
# target the deterministic fixture; inspect recorded checker counts and handoff.
appId: ${APP_ID}
tags:
  - ios
  - pull-request
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Play against the computer
    timeout: 90000
# Navigate within the preview app: the external URL handoff can return Home
# after the preceding language flow restarts the native application.
- tapOn: Settings
- scrollUntilVisible:
    element:
      text: Load position.*
    direction: DOWN
- tapOn: Load position.*
- extendedWaitUntil:
    visible:
      id: developer-preset-e2e-undo-redo-3-1
    timeout: 60000
- tapOn:
    id: developer-preset-e2e-undo-redo-3-1
- extendedWaitUntil:
    visible:
      id: game-board-slot
    timeout: 20000
- assertVisible: White pip count 167
- takeScreenshot: ios-confirm-01-fixed-roll
- tapOn:
    point: ${POINT_8}
- tapOn:
    point: ${POINT_5}
# A compound 8→4 also enables Undo; the pip count rejects that false positive.
- extendedWaitUntil:
    visible: White pip count 164
    timeout: 15000
- assertNotVisible:
    id: confirm-move-button
- assertVisible: Undo move
- takeScreenshot: ios-confirm-02-first-move
- tapOn: Undo move
- extendedWaitUntil:
    visible: White pip count 167
    timeout: 15000
- assertVisible:
    id: undo-button
    enabled: false
- takeScreenshot: ios-confirm-03-undo-restored
- tapOn:
    point: ${POINT_8}
- tapOn:
    point: ${POINT_5}
- tapOn:
    point: ${POINT_6}
- tapOn:
    point: ${POINT_5}
- extendedWaitUntil:
    visible:
      id: confirm-move-button
    timeout: 15000
- assertVisible: White pip count 163
- assertNotVisible: ".*Black's turn.*"
- tapOn:
    id: history-live-button
- assertVisible:
    id: confirm-move-button
- assertVisible: White pip count 163
- assertNotVisible: ".*Black's turn.*"
- takeScreenshot: ios-confirm-04-held-turn
- tapOn:
    id: confirm-move-button
- extendedWaitUntil:
    visible: ".*Black's turn.*"
    timeout: 15000
- takeScreenshot: ios-confirm-05-black-handoff
