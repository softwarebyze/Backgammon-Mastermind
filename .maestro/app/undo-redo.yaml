# Undo/redo on a deterministic board: the developer preset deals a fixed 3-1 on
# the standard setup (pass-and-play), so the flow always has a move to undo.
# Every step waits on the button's enabled state, so the flow fails if undo or
# redo never becomes available.
appId: ${APP_ID}
tags:
  - pull-request
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: vs Computer
    timeout: 90000
- openLink: backgammonmastermind.preview://developer
- extendedWaitUntil:
    visible:
      id: developer-preset-e2e-undo-redo-3-1
    timeout: 60000
- tapOn:
    id: developer-preset-e2e-undo-redo-3-1
- extendedWaitUntil:
    visible:
      id: point-8
    timeout: 45000
# Nothing played yet: undo and redo are both unavailable.
- assertVisible:
    id: undo-button
    enabled: false
- assertVisible:
    id: redo-button
    enabled: false
- takeScreenshot: 01-before-move
# Play 8 -> 5 with the 3.
- tapOn:
    id: point-8
- tapOn:
    id: point-5
- extendedWaitUntil:
    visible:
      id: undo-button
      enabled: true
    timeout: 15000
- takeScreenshot: 02-after-move
- tapOn:
    id: undo-button
- extendedWaitUntil:
    visible:
      id: redo-button
      enabled: true
    timeout: 15000
# Back at the start of the turn: nothing left to undo, same roll still playable.
- extendedWaitUntil:
    visible:
      id: undo-button
      enabled: false
    timeout: 15000
- takeScreenshot: 03-after-undo
- tapOn:
    id: redo-button
- extendedWaitUntil:
    visible:
      id: undo-button
      enabled: true
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: redo-button
      enabled: false
    timeout: 15000
- takeScreenshot: 04-after-redo
