# Cold launch preserves the last computer five-point match. Cancelling a
# replacement must keep setup on Home and the saved match available to resume.
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'false'
      HOME_TEXT: Play against the computer
- assertVisible:
    id: resume-game-button
- tapOn:
    id: home-opponent-vs-human
- tapOn:
    id: home-format-match
- scrollUntilVisible:
    element:
      id: home-match-length-3
    direction: DOWN
- tapOn:
    id: home-match-length-3
- scrollUntilVisible:
    element:
      id: home-start-game
    direction: DOWN
- tapOn:
    id: home-start-game
- assertVisible: New game
- takeScreenshot: home-setup-replace-confirmation
- tapOn: Cancel
- assertVisible:
    id: home-start-game
- assertNotVisible:
    id: game-board-slot
- takeScreenshot: home-setup-replacement-cancelled
- scrollUntilVisible:
    element:
      id: resume-game-button
    direction: UP
- tapOn:
    id: resume-game-button
- extendedWaitUntil:
    visible: Match to 5 · Game 1
    timeout: 45000
- takeScreenshot: home-setup-original-match-preserved
