# One opponent selection, then format and optional length, then explicit Start.
# Each fresh launch isolates all six start combinations from replacement dialogs.
appId: ${APP_ID}
tags:
  - pull-request
---
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: Play against the computer
- tapOn:
    id: home-opponent-vs-human
- assertNotVisible:
    id: game-board-slot
- tapOn:
    id: home-format-single
- assertNotVisible:
    id: home-match-length-3
- scrollUntilVisible:
    element:
      id: home-start-game
    direction: DOWN
- takeScreenshot: home-setup-vs-human-single-selection
- tapOn:
    id: home-start-game
- extendedWaitUntil:
    visible:
      id: game-board-slot
    timeout: 45000
- assertNotVisible:
    id: match-score
- takeScreenshot: home-setup-vs-human-single-started
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: Play against the computer
- tapOn:
    id: home-opponent-vs-human
- assertNotVisible:
    id: game-board-slot
- tapOn:
    id: home-format-match
- scrollUntilVisible:
    element:
      id: home-match-length-3
    direction: DOWN
- tapOn:
    id: home-match-length-3
# The Crawford rule is chosen per match and is on by default.
- scrollUntilVisible:
    element:
      id: home-crawford-on
    direction: DOWN
- assertVisible:
    id: home-crawford-off
- scrollUntilVisible:
    element:
      id: home-start-game
    direction: DOWN
- takeScreenshot: home-setup-vs-human-3-selection
- tapOn:
    id: home-start-game
- extendedWaitUntil:
    visible:
      id: game-board-slot
    timeout: 45000
- assertVisible: Match to 3 · Game 1
- assertVisible:
    id: match-score
- takeScreenshot: home-setup-vs-human-3-started
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: Play against the computer
- tapOn:
    id: home-opponent-vs-human
- assertNotVisible:
    id: game-board-slot
- tapOn:
