# Native: picking Arabic forces I18nManager RTL + app restart.
# Screenshots prove Settings LTR → post-pick Arabic → post-restart RTL layout.
appId: ${APP_ID}
tags:
  - settings
  - i18n
  - rtl
  - pull-request
---
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: vs Computer
- tapOn:
    text: Settings
- extendedWaitUntil:
    visible: Language
    timeout: 15000
- takeScreenshot: lang-01-settings-en
- tapOn:
    text: Language
- extendedWaitUntil:
    visible: العربية
    timeout: 15000
- tapOn:
    text: العربية
# Release builds call RNRestart; some builds may show a restart confirm.
- runFlow:
    when:
      visible: '.*(?i)restart.*'
    commands:
      - tapOn: '.*(?i)restart.*'
- takeScreenshot: lang-02-after-pick-ar
# Ensure a cold relaunch so I18nManager.isRTL is applied (MMKV language kept).
- stopApp
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'false'
      HOME_TEXT: ضد الكمبيوتر
- tapOn:
    text: إعدادات
- extendedWaitUntil:
    visible: لغة
    timeout: 15000
- takeScreenshot: lang-03-after-restart-ar-rtl
# Learn navigation glyphs must follow the native RTL layout after restart.
- tapOn:
    id: stack-escape-button
- tapOn: تعلّم اللعب
- extendedWaitUntil:
    visible:
      id: learn-progress-ring
    timeout: 15000
- takeScreenshot: lang-04-learn-hub-rtl
- tapOn:
    id: learn-lesson-row-goal-board
- extendedWaitUntil:
    visible:
      id: learn-primary-cta
    timeout: 15000
- takeScreenshot: lang-05-learn-continue-rtl
- tapOn:
    id: learn-primary-cta
- tapOn:
    id: learn-back
- assertVisible: الخطوة 1 من 3
- takeScreenshot: lang-06-learn-back-rtl
