# Opt-in checker taps spend the displayed leading die. Includes swap, guidance,
# persistence through navigation, Undo/Redo, confirm hold and fast follow-up.
appId: ${APP_ID}
tags:
  - pull-request
---
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: vs Computer
- tapOn: Settings
- scrollUntilVisible:
    element:
      id: setting-toggle-dice-order
    direction: DOWN
- tapOn:
    id: setting-toggle-dice-order
- scrollUntilVisible:
    element:
      text: Auto-roll dice
    direction: UP
- tapOn: Auto-roll dice
- tapOn: Auto-move when forced
- takeScreenshot: dice-order-01-setting-enabled
- tapOn:
    id: stack-escape-button
- openLink: backgammonmastermind.preview://developer
- tapOn:
    id: developer-preset-e2e-undo-redo-3-1
- extendedWaitUntil:
    visible:
      id: swap-dice-button
    timeout: 45000
- takeScreenshot: dice-order-02-leading-three
- tapOn:
    id: swap-dice-button
- takeScreenshot: dice-order-03-leading-one
- tapOn:
    id: point-8
- extendedWaitUntil:
    visible: 'Point 7, 1 white checker'
    timeout: 15000
- assertVisible: 'Point 8, 2 white checkers'
- tapOn:
    id: header-undo-button
- extendedWaitUntil:
    visible: 'Point 8, 3 white checkers'
    timeout: 15000
- tapOn:
    id: header-redo-button
- extendedWaitUntil:
    visible: 'Point 7, 1 white checker'
    timeout: 15000
- tapOn:
    id: point-13
- extendedWaitUntil:
    visible:
      id: confirm-move-button
    timeout: 15000
- assertVisible: 'Point 10, 1 white checker'
- takeScreenshot: dice-order-04-confirm-hold
- tapOn:
    id: confirm-move-button
# A fresh fixture returns to original order. Leading five is blocked from 6;
# no silent substitution of the legal three is allowed.
- openLink: backgammonmastermind.preview://developer
- scrollUntilVisible:
    element:
      id: developer-json-input
    direction: DOWN
- longPressOn:
    id: developer-json-input
- tapOn: (?i)select all
- eraseText: 1
- inputText: '{"useStandardSetup":true,"dice":[5,3],"mode":"vs-human"}'
- hideKeyboard
- tapOn:
    id: developer-load-json
- extendedWaitUntil:
    visible:
      id: point-6
    timeout: 15000
- tapOn:
    id: point-6
- assertVisible: 'Point 6, 5 white checkers'
- assertVisible: This checker cannot use the first unspent die. Swap dice or choose another checker.
- takeScreenshot: dice-order-05-blocked-guidance
- tapOn:
    id: swap-dice-button
- tapOn:
    id: point-6
    waitToSettleTimeoutMs: 0
- tapOn:
    id: point-13
    point: '50%,50%'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible: 'Point 3, 1 white checker'
    timeout: 15000
- assertVisible: 'Point 6, 4 white checkers'
- assertVisible: 'Point 13, 4 white checkers'
- assertVisible: 'Point 8, 4 white checkers'
- takeScreenshot: dice-order-06-fast-follow-up
# Drag is independent of displayed order. On the CI portrait board, RIGHT
# from a bottom-row point ends at 90% screen width, in the bear-off tray.
- runFlow:
    file: ../utils/dice-order-drag-position.yaml
    env:
      POSITION_JSON: '{"placements":[{"point":3,"player":"white","count":15},{"point":24,"player":"black","count":15}],"dice":[3,1],"mode":"vs-human"}'
- swipe:
    from:
      id: point-3
    direction: RIGHT
    duration: 900
- extendedWaitUntil:
    visible: 'Point 3, 14 white checkers'
    timeout: 15000
- assertVisible: 'Point 3, 14 white checkers'
- assertNotVisible:
    id: confirm-move-button
- takeScreenshot: dice-order-07-drag-leading-die
- tapOn:
    id: header-undo-button
- extendedWaitUntil:
    visible: 'Point 3, 15 white checkers'
    timeout: 15000
- tapOn:
    id: swap-dice-button
# Leading die is now 1; dragging 3→off still spends the 3. An accidental
# release tap would move another checker and make Confirm visible.
- swipe:
    from:
      id: point-3
    direction: RIGHT
    duration: 900
- extendedWaitUntil:
    visible: 'Point 3, 14 white checkers'
    timeout: 15000
- assertVisible: 'Point 3, 14 white checkers'
- assertNotVisible:
    id: confirm-move-button
- takeScreenshot: dice-order-08-drag-other-die-swapped
- tapOn:
    id: header-undo-button
- extendedWaitUntil:
    visible: 'Point 3, 15 white checkers'
    timeout: 15000
# Far outside any legal destination: board and dice stay unchanged.
- swipe:
    from:
      id: point-3
    direction: LEFT
    duration: 900
- assertVisible: 'Point 3, 15 white checkers'
- assertVisible:
    id: swap-dice-button
- takeScreenshot: dice-order-09-invalid-drop
- runFlow:
    file: ../utils/dice-order-drag-position.yaml
    env:
      POSITION_JSON: '{"placements":[{"point":4,"player":"white","count":15},{"point":24,"player":"black","count":15}],"dice":[3,1],"mode":"vs-human"}'
- tapOn:
    id: swap-dice-button
- swipe:
    from:
      id: point-4
    direction: RIGHT
    duration: 900
- extendedWaitUntil:
    visible: 'Point 4, 14 white checkers'
    timeout: 15000
- assertVisible: 'Point 4, 14 white checkers'
- assertVisible:
    id: confirm-move-button
- takeScreenshot: dice-order-10-drag-compound-swapped
# RTL retains the board's physical geometry; the dice reading edge reverses.
- openLink: backgammonmastermind.preview://settings
- scrollUntilVisible:
    element:
      text: Language
    direction: UP
- tapOn: Language
- scrollUntilVisible:
    element:
      text: עברית
    direction: DOWN
- tapOn: עברית
- stopApp
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'false'
      HOME_TEXT: נגד המחשב
- runFlow:
    file: ../utils/dice-order-drag-position.yaml
    env:
      POSITION_JSON: '{"placements":[{"point":4,"player":"white","count":15},{"point":24,"player":"black","count":15}],"dice":[3,1],"mode":"vs-human"}'
- tapOn:
    id: swap-dice-button
- swipe:
    from:
      id: point-4
    direction: RIGHT
    duration: 900
- extendedWaitUntil:
    visible: 'Point 4, 14 white checkers'
    timeout: 15000
- assertVisible: 'Point 4, 14 white checkers'
- assertVisible:
    id: confirm-move-button
- takeScreenshot: dice-order-11-drag-compound-rtl
