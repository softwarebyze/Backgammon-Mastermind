# iOS match coverage: start a 7-point match from Home, then continue a 7-point
# match at 2–1 from a set-up position (no dice needed to reach the cube):
# White doubles, Black takes, and the cube survives a relaunch.
appId: ${APP_ID}
tags:
  - ios
---
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: Play against the computer
- tapOn:
    id: home-opponent-vs-human
- tapOn:
    id: home-format-match
- scrollUntilVisible:
    element:
      id: home-match-length-7
    direction: DOWN
- tapOn:
    id: home-match-length-7
- assertVisible:
    id: home-crawford
- scrollUntilVisible:
    element:
      id: home-start-game
    direction: DOWN
# iOS reads a button as one accessibility label, so match it by id and prefix.
- assertVisible:
    id: home-start-game
    text: 'Start 7-point match.*'
- takeScreenshot: match-seven-ios-01-setup
- tapOn:
    id: home-start-game
- extendedWaitUntil:
    visible:
      id: match-score
    timeout: 45000
- assertVisible:
    id: match-score
    text: 'Match to 7 · Game 1.*'
- takeScreenshot: match-seven-ios-02-started
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: resume-game-button
    timeout: 60000
- tapOn:
    id: resume-game-button
- extendedWaitUntil:
    visible:
      id: match-score
      text: 'Match to 7 · Game 1.*'
    timeout: 30000
- takeScreenshot: match-seven-ios-03-resumed
# A set-up 7-point position plays as that match: White on roll can double.
- runScript: ../utils/match-seven-cube-link.js
- openLink: ${output.matchSevenLink}
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: position-screen
    timeout: 30000
- runFlow:
    file: ../utils/position-scroll.yaml
    env:
      TARGET_ID: position-play
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-mode-human
- tapOn:
    id: position-play
- runFlow:
    when:
      visible:
        id: confirm-dialog-confirm
    commands:
      - tapOn:
          id: confirm-dialog-confirm
- extendedWaitUntil:
    visible:
      id: match-double
    timeout: 45000
- assertVisible:
    id: match-score
    text: 'Match to 7 · Game 1.*'
- takeScreenshot: match-seven-ios-04-double-or-roll
- tapOn:
    id: match-double
- tapOn:
    id: match-accept
- extendedWaitUntil:
    visible:
      id: match-cube
      text: 'Cube 2 · Black.*'
    timeout: 15000
- takeScreenshot: match-seven-ios-05-cube-taken
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: resume-game-button
    timeout: 60000
- tapOn:
    id: resume-game-button
- extendedWaitUntil:
    visible:
      id: match-cube
      text: 'Cube 2 · Black.*'
    timeout: 30000
- takeScreenshot: match-seven-ios-06-cube-resumed
