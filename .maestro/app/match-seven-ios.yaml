# iOS match coverage: start a 7-point match from Home, check the header and
# score, then relaunch and resume it. Cube exchanges are covered on Android
# through the Developer presets, since a live double depends on the dice.
appId: ${APP_ID}
tags:
  - ios
---
- runFlow:
    file: ../utils/launch-app.yaml
    env:
      CLEAR_STATE: 'true'
      HOME_TEXT: Play against the computer
- tapOn:
    id: home-opponent-vs-human
- tapOn:
    id: home-format-match
- scrollUntilVisible:
    element:
      id: home-match-length-7
    direction: DOWN
- tapOn:
    id: home-match-length-7
- assertVisible:
    id: home-crawford
- scrollUntilVisible:
    element:
      id: home-start-game
    direction: DOWN
- assertVisible: Start 7-point match
- takeScreenshot: match-seven-ios-01-setup
- tapOn:
    id: home-start-game
- extendedWaitUntil:
    visible:
      id: match-score
    timeout: 45000
- assertVisible: Match to 7 · Game 1
- takeScreenshot: match-seven-ios-02-started
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: resume-game-button
    timeout: 60000
- tapOn:
    id: resume-game-button
- extendedWaitUntil:
    visible: Match to 7 · Game 1
    timeout: 30000
- takeScreenshot: match-seven-ios-03-resumed
