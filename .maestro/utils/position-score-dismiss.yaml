appId: ${APP_ID}
tags:
  - util
---
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: Done
      - assertVisible:
          id: position-match-length
      - assertVisible:
          id: position-score-white
      - assertVisible:
          id: position-score-black
      - takeScreenshot: position-score-keyboard
      - tapOn: Done
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
