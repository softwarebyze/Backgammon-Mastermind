appId: ${APP_ID}
tags:
  - util
---
# The initial touch chooses a checker slot, rather than always adding one.
- tapOn:
    id: point-6
    point: '50%, 95%'
- assertVisible: 'Point 6, 1 white checker, selected'
- tapOn:
    id: point-6
    point: '50%, 50%'
- assertVisible: 'Point 6, [2-9] white checkers, selected'
- takeScreenshot: position-press-01-count
- tapOn:
    id: point-6
    point: '50%, 95%'
- assertVisible: 'Point 6, 1 white checker, selected'
- swipe:
    from:
      id: point-6
      point: '50%, 95%'
    direction: UP
    duration: 900
- swipe:
    from:
      id: point-6
      point: '50%, 95%'
    direction: UP
    duration: 900
# Swipe distance maps to checker slots, so a tall iPad point can stop one
# checker short. The + stepper tops it off (and refreshes iOS's accessibility snapshot).
- runFlow:
    file: position-step.yaml
    env:
      STEPPER: position-stack-count
      SIDE: higher
- assertVisible: 'Point 6, 15 white checkers, selected'
- takeScreenshot: position-drag-01-white
# All white checkers are used. This blocked press must keep the empty point
# unchanged; haptic and accessibility feedback are covered by unit tests.
- tapOn:
    id: point-7
    point: '50%, 95%'
- assertVisible: 'Point 7, selected'
- takeScreenshot: position-press-02-exhausted
- swipe:
    from:
      id: point-6
    direction: DOWN
    duration: 900
- assertVisible: 'Point 6, selected'
- tapOn:
    id: position-paint-black
- swipe:
    from:
      id: point-13
    direction: DOWN
    duration: 900
- assertVisible: 'Point 13, 15 black checkers, selected'
- takeScreenshot: position-drag-02-black
- tapOn:
    id: position-paint-white
