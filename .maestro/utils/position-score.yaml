appId: ${APP_ID}
tags:
  - util
---
# Scores are steppers: no number pad, so no keyboard Done bar to dismiss.
- runFlow:
    file: position-scroll.yaml
    env:
      TARGET_ID: position-score-toggle
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-score-toggle
- assertVisible:
    id: position-match-length
- repeat:
    times: 5
    commands:
      - tapOn:
          id: position-match-length-higher
- repeat:
    times: 3
    commands:
      - tapOn:
          id: position-score-white-higher
- repeat:
    times: 2
    commands:
      - tapOn:
          id: position-score-black-higher
- assertVisible:
    id: position-score-white
    text: 'White score: 3'
- assertVisible:
    id: position-score-black
    text: 'Black score: 2'
- assertVisible:
    id: position-match-length
    text: 'Match to: 5'
- takeScreenshot: position-editable-scoreboard
- tapOn:
    id: position-detail-done
- assertNotVisible:
    id: position-match-length
- assertVisible:
    id: position-score-toggle
- takeScreenshot: position-compact-score-summary
