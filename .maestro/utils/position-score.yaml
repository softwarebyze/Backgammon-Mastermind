appId: ${APP_ID}
tags:
  - util
---
- runFlow:
    file: position-scroll.yaml
    env:
      TARGET_ID: position-score-toggle
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-score-toggle
- assertVisible:
    id: position-match-length
- tapOn:
    id: position-match-length
- eraseText
- inputText: '5'
- runFlow: position-score-dismiss.yaml
- tapOn:
    id: position-score-white
- eraseText
- inputText: '3'
- runFlow: position-score-dismiss.yaml
- tapOn:
    id: position-score-black
- eraseText
- inputText: '2'
- runFlow: position-score-dismiss.yaml
- assertVisible:
    id: position-score-white
    text: '3'
- assertVisible:
    id: position-score-black
    text: '2'
- assertVisible:
    id: position-match-length
    text: '5'
- takeScreenshot: position-editable-scoreboard

- tapOn:
    id: position-detail-done
- assertNotVisible:
    id: position-match-length
- assertVisible:
    id: position-score-toggle
- takeScreenshot: position-compact-score-summary
