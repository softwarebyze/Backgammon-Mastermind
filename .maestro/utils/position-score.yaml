appId: ${APP_ID}
tags:
  - util
---
# Match length sits under the board; each score lives in its player strip.
- runFlow:
    file: position-scroll.yaml
    env:
      TARGET_ID: position-match-length-higher
      START_Y: '80%'
      END_Y: '25%'
- assertVisible:
    id: position-match-length
    text: Money game
- repeat:
    times: 5
    commands:
      - runFlow:
          file: position-step.yaml
          env:
            STEPPER: position-match-length
            SIDE: higher
- assertVisible:
    id: position-match-length
    text: Match to 5
- repeat:
    times: 3
    commands:
      - runFlow:
          file: position-step.yaml
          env:
            STEPPER: position-score-white
            SIDE: higher
- runFlow:
    file: position-scroll.yaml
    env:
      TARGET_ID: position-score-black-higher
      START_Y: '25%'
      END_Y: '80%'
- repeat:
    times: 2
    commands:
      - runFlow:
          file: position-step.yaml
          env:
            STEPPER: position-score-black
            SIDE: higher
- assertVisible:
    id: position-score-white-value
    text: '3'
- assertVisible:
    id: position-score-black-value
    text: '2'
- takeScreenshot: position-editable-scoreboard
