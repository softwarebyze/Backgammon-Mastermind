appId: ${APP_ID}
---
- openLink: ${POSITION_LINK}
- extendedWaitUntil:
    visible:
      id: position-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: position-mode-human
    direction: DOWN
- tapOn:
    id: position-mode-human
- scrollUntilVisible:
    element:
      id: position-play
    direction: DOWN
- tapOn:
    id: position-play
- runFlow:
    when:
      visible: New game
    commands:
      - tapOn: New game
- extendedWaitUntil:
    notVisible:
      id: position-screen
    timeout: 30000
