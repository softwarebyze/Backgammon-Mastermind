appId: ${APP_ID}
---
- openLink: ${POSITION_LINK}
- extendedWaitUntil:
    visible:
      id: position-screen
    timeout: 30000
- runFlow:
    when:
      visible: 'Take or pass\?'
    commands:
      - assertVisible:
          id: player-status-.*
          text: 'Doubles to .*'
- runFlow:
    file: position-scroll.yaml
    env:
      TARGET_ID: position-mode-human
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-mode-human
- runFlow:
    file: position-scroll.yaml
    env:
      TARGET_ID: position-play
      START_Y: '80%'
      END_Y: '25%'
- tapOn:
    id: position-play
- runFlow:
    when:
      visible: New game
    commands:
      - tapOn: New game
- extendedWaitUntil:
    notVisible:
      id: position-screen
    timeout: 30000
