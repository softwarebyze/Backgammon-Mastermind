<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Master the board — one move at a time." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Backgammon Mastermind" />
    <meta property="og:description" content="Master the board — one move at a time." />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Backgammon Mastermind" />
    <meta name="twitter:image" content="/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Vercel preview comments pill + leftover Expo debug FABs steal taps. */
      vercel-live-feedback,
      #vercel-live-feedback,
      [data-vercel-toolbar],
      [data-vercel-toolbar-container],
      iframe[src*="vercel.live"],
      #expo-dev-client-menu,
      [data-expo-dev-menu] {
        display: none !important;
        pointer-events: none !important;
        visibility: hidden !important;
      }
    </style>
    <script>
      (function () {
        var sel =
          'vercel-live-feedback, #vercel-live-feedback, [data-vercel-toolbar], [data-vercel-toolbar-container], iframe[src*="vercel.live"]';
        var zap = function () {
          document.querySelectorAll(sel).forEach(function (el) {
            el.remove();
          });
        };
        zap();
        try {
          new MutationObserver(zap).observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
